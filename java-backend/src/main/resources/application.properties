# ===================================================================
# Server Configuration
# ===================================================================
# The port on which the Spring Boot application will run
server.port=8081

# ===================================================================
# Database Configuration
# ===================================================================
# JDBC URL for connecting to the MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/counterfeit_db
# Database username (default for XAMPP is usually 'root')
spring.datasource.username=root
# Database password (default for XAMPP root is empty)
spring.datasource.password=

# ===================================================================
# JPA/Hibernate Configuration
# ===================================================================
# Automatically update the database schema based on the entity classes
spring.jpa.hibernate.ddl-auto=update
# Show the SQL queries generated by Hibernate in the console
spring.jpa.show-sql=true
# Specify the dialect to ensure Hibernate uses MySQL-specific SQL syntax
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# File Upload Configuration
# ===================================================================
# Maximum allowed size for a single uploaded file
spring.servlet.multipart.max-file-size=10MB
# Maximum allowed size for an entire multipart request (multiple files)
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Custom Application Properties
# ===================================================================
# Directory where uploaded files will be stored
app.upload.dir=./uploads/
